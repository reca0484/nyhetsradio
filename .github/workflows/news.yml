name: Publicera dagens nyheter
on:
  workflow_dispatch:
  schedule:
    - cron: '5 9 * * *'
    - cron: '5 10 * * *'
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Skapa rapport
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python generate.py
      - name: Publicera rapport
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add report.json
          if ! git diff --cached --quiet; then git commit -m 'Uppdatera dagens nyheter'; git push; fi
