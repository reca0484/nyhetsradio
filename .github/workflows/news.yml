name: Publicera dagens nyheter
on:
  workflow_dispatch:
  schedule:
    - cron: '5 9 * * *'
    - cron: '5 10 * * *'
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installera gratis lokal taligenkänning
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install faster-whisper==1.2.1
      - name: Transkribera Ekot P1 Morgon Studio Ett
        continue-on-error: true
        run: python transcribe_sr.py
      - name: Skapa rapport
        env:
          SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python generate.py
      - name: Publicera rapport
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add report.json
          if test -f sr_transcripts.json; then git add sr_transcripts.json; fi
          if ! git diff --cached --quiet; then git commit -m 'Uppdatera dagens nyheter'; git push; fi
