<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lyssna på dagens nyheter</title><style>body{font:18px/1.6 system-ui,sans-serif;max-width:760px;margin:auto;padding:24px;background:#f7f8fa;color:#17212b}h1{line-height:1.2}button{background:#145d88;color:white;border:0;border-radius:12px;padding:15px 20px;font-size:18px;margin:8px 8px 8px 0}article{white-space:pre-wrap;background:white;padding:20px;border-radius:12px}small{color:#53606b}</style></head><body><h1>Lyssna på dagens nyheter</h1><p id="status">Hämtar rapporten …</p><p><a href="https://github.com/reca0484/nyhetsradio/actions/workflows/news.yml" target="_blank" rel="noopener">▶ Kör nyhetsuppdatering (Run workflow)</a> &nbsp; <a href="https://reca0484.github.io/nyhetsradio/?fresh=1">↻ Öppna nyhetssidan</a></p><button id="refresh" onclick="load()">Hämta senaste rapport</button><button id="share">Dela till ElevenReader</button><button id="copy">Kopiera text</button><article id="report"></article><script>let text='';async function load(){try{let j;try{const live=await fetch('https://api.github.com/repos/reca0484/nyhetsradio/contents/report.json?ts='+Date.now(),{cache:'no-store',headers:{'Accept':'application/vnd.github.raw+json'}});if(!live.ok)throw Error('GitHub '+live.status);j=await live.json();if(j.content&&j.encoding==='base64'){const bytes=atob(j.content.replace(/\\s/g,''));j=JSON.parse(new TextDecoder().decode(Uint8Array.from(bytes,c=>c.charCodeAt(0))))}}catch(err){const fallback=await fetch('report.json?ts='+Date.now(),{cache:'no-store'});if(!fallback.ok)throw err;j=await fallback.json()}text=j.text||'';document.getElementById('status').textContent='Senast uppdaterad: '+(j.updated||'okänt')+' · '+text.length+' tecken';document.getElementById('report').textContent=text||'Ingen rapport publicerad ännu.'}catch(e){document.getElementById('status').textContent='Rapporten kunde inte hämtas: '+e.message}}document.getElementById('share').onclick=async()=>{if(!text)return alert('Ingen rapport att dela ännu.');if(navigator.share){try{await navigator.share({title:'Dagens nyheter',text})}catch(e){}}else{await navigator.clipboard.writeText(text);alert('Texten kopierad. Öppna ElevenReader.')}};document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(text);alert('Texten kopierad.')};load();</script></body></html>
